services:
  # 1. Redis - cache (starts first, no dependencies)
  redis:
    image: redis:alpine
    container_name: crazywalk-redis
    restart: always
    command: redis-server --port 6500
    ports:
      - "6500:6500"
    networks:
      - crazywalk-net

  # 2. Backend - API server (Node.js)
  backend:
    build:
      context: .
      dockerfile: tools/backend/Dockerfile
    container_name: crazywalk-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6500
    env_file:
      - .env
    networks:
      - crazywalk-net
    depends_on:
      - redis

  # 3. Frontend - static files (nginx)
  frontend:
    build:
      context: .
      dockerfile: tools/frontend/Dockerfile
    container_name: crazywalk-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - crazywalk-net
    depends_on:
      - backend

  # 4. Webhook - auto-update from GitHub (independent)
  webhook:
    build:
      context: .
      dockerfile: tools/AUTOUPDATE_WEBHOOK_FROM_GITHUB/Dockerfile
    container_name: crazywalk-webhook-update
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    env_file:
      - .env
    environment:
      - AUTOUPDATE_WEBHOOK_FROM_GITHUB=${AUTOUPDATE_WEBHOOK_FROM_GITHUB}
    networks:
      - crazywalk-net

networks:
  crazywalk-net:
    driver: bridge
