<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Game state is persisted exclusively via Redis (server-side). No client-side storage used. -->
    <meta charset="UTF-8">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Map Location</title>
    <script>
        // Mask URL to show only root address
        window.history.replaceState(null, '', '/');
    </script>
    <!-- Preload iPhone Frame (highest priority) -->
    <link rel="preload" href="/assets/iphone.png" as="image" fetchpriority="high">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Map Page Styles (extracted from inline) -->
    <link rel="stylesheet" href="/css/map.css">
</head>

<body>
    <div class="black-square">
        <div id="map"></div>

        <div id="top-bar-container" style="opacity: 0; transition: opacity 0.8s ease-in-out;"></div>
        <img id="loading-gif" src="/assets/earth.gif" alt="Loading...">

        <!-- Red Error Screen -->
        <div id="error-screen">
            <!-- Icon will be inserted dynamically or can use unicode if FontAwesome not loaded, but user has it cached? -->
            <!-- Using SVG or simple text to be safe if FA not present on map page (it wasn't in head) -->
            <div style="font-size: 8vh; color: white; margin-bottom: 2vh;">&#9888;</div>
            <h1>CRITICAL ERROR</h1>
            <p id="error-message">No map data found.</p>
            <button class="btn-retry" id="retry-btn">RETRY</button>
        </div>

        <!-- Version Badge -->
        <div id="version-badge">v0.0.0</div>

    </div>
    <img class="phone-frame" src="/assets/iphone.png" alt="Phone Frame">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Map Controls Modules -->
    <script src="/js/components/map/SnapLogic.js"></script>
    <script src="/js/components/map/NavigationGraph.js"></script>
    <script src="/js/components/map/KeyboardNavigation.js"></script>
    <!-- Map Controls Logic -->
    <script src="/js/components/map/map_controls.js?v=10"></script>
    <!-- Game API (New src location) -->
    <script type="module" src="/js/game-api.js"></script>
    <!-- Main Map Logic (extracted from inline) -->
    <script type="module" src="/js/map-logic.js"></script>
</body>

</html>
